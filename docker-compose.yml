services:
  app:
    build: .
    image: miapp:1.0
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: miapp
      DB_PASSWORD: miapp_pass
      DB_NAME: miapp
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: miapp
      MYSQL_USER: miapp
      MYSQL_PASSWORD: miapp_pass
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
